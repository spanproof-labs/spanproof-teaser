name: SpanProof Deterministic CI Gate

on:
  pull_request:
  push:

jobs:
  spanproof-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run 280-item deterministic guardrail & gold verification
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 demo_guardrail_proof.py --verify-all

      - name: Run stdio MCP integration tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 tests/test_mcp_stdio.py
