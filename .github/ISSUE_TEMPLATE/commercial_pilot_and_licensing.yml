name: Question or bug report
description: Report a wrong verdict, a bad answer key, or ask a question about regeval or the items.
title: "[Report] <short summary>"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Issues here are public, so please leave out anything confidential.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of report is this?
      options:
        - Wrong verdict (the grader passed a wrong answer or failed a right one)
        - Answer key or item problem
        - Install, run or MCP server problem
        - Question
    validations:
      required: true
  - type: input
    id: item_id
    attributes:
      label: Item ID (if any)
      placeholder: e.g. GT-K-DFARS-000010
  - type: textarea
    id: details
    attributes:
      label: What happened
      description: For a wrong verdict, paste the answer text you graded, the verdict you got, and the verdict you expected.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Python version and commit
      placeholder: e.g. Python 3.12, commit d106cc7
